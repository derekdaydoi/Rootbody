name: One-time iOS shell rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-shell-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild iOS standalone shell at source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "69"

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          s = s.replace(
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-status-bar>',
              '<meta name="apple-mobile-web-app-status-bar-style" content="default" data-status-bar>'
          )
          s = s.replace(
              'const saved = localStorage.getItem("rootbody.theme");\n        const theme = saved === "dark" || saved === "light" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");',
              'const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";\n        const saved = localStorage.getItem("rootbody.theme");\n        const theme = standalone ? systemTheme : (saved === "dark" || saved === "light" ? saved : systemTheme);'
          )
          old_roots = '<path class="splash-roots" pathLength="1" d="M112 150V228M112 157C97 168 82 176 61 183M112 163C98 181 88 199 84 214M112 157C127 168 142 176 163 183M112 163C126 181 136 199 140 214" fill="none" stroke="#0FA3A3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>'
          new_roots = '<path class="splash-roots" pathLength="1" d="M112 150C112 178 112 204 112 228M110 158C94 169 78 180 58 187M110 168C99 181 91 197 87 214M114 158C130 169 146 180 166 187M114 168C125 181 133 197 137 214" fill="none" stroke="#0FA3A3" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>'
          s = s.replace(old_roots, new_roots)
          for asset in ["styles.css", "v8.css", "food-data.js", "coach-data.js", "health-engine.js", "app.js", "coach.js", "intelligence.js"]:
              s = re.sub(rf'({re.escape(asset)})\?v=\d+', rf'\1?v={VERSION}', s)
          s = re.sub(r'href="\.\/manifest\.webmanifest(?:\?v=\d+)?"', f'href="./manifest.webmanifest?v={VERSION}"', s)
          s = re.sub(r'href="\.\/icon-180\.png(?:\?v=\d+)?"', f'href="./icon-180.png?v={VERSION}"', s)
          path.write_text(s, encoding="utf-8")

          path = Path("app.js")
          s = path.read_text(encoding="utf-8")
          s = re.sub(
              r'\n\s*const statusBar = \$\("\[data-status-bar\]"\);\n\s*if \(statusBar\) statusBar\.setAttribute\("content", "black-translucent"\);',
              '',
              s,
              count=1
          )
          sync_block = '''\n  const standaloneThemeMedia = matchMedia("(prefers-color-scheme: dark)");\n  const isStandalonePwa = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;\n  if (isStandalonePwa) {\n    const syncStandaloneTheme = () => applyTheme(standaloneThemeMedia.matches ? "dark" : "light", false);\n    if (standaloneThemeMedia.addEventListener) standaloneThemeMedia.addEventListener("change", syncStandaloneTheme);\n    else if (standaloneThemeMedia.addListener) standaloneThemeMedia.addListener(syncStandaloneTheme);\n  }\n'''
          marker = '  renderAll();\n  navigate(location.hash.slice(1) || "today");'
          if 'const standaloneThemeMedia' not in s:
              s = s.replace(marker, sync_block + '\n' + marker)
          s = re.sub(r'navigator\.serviceWorker\.register\("\.\/sw\.js\?v=\d+"\)', f'navigator.serviceWorker.register("./sw.js?v={VERSION}")', s)
          path.write_text(s, encoding="utf-8")

          path = Path("v8.css")
          s = path.read_text(encoding="utf-8")
          s = s.replace(
              'html.standalone-pwa { --rb-safe-top: max(env(safe-area-inset-top, 0px), 28px); }',
              'html.standalone-pwa { --rb-safe-top: 0px; }'
          )
          s = re.sub(
              r'\nhtml\.standalone-pwa body::before \{.*?\n\}\n',
              '\n',
              s,
              count=1,
              flags=re.S
          )
          s = s.replace(
              '.rb-priority-card img { right: -5px; bottom: -4px; width: 124px; height: 145px; opacity: .76; }',
              '.rb-priority-card img { right: -5px; bottom: -4px; width: 112px; height: 131px; opacity: .76; }'
          )
          if '/* iOS standalone shell v69 */' not in s:
              s += '''\n\n/* iOS standalone shell v69 */\nhtml.standalone-pwa [data-theme-toggle],\nhtml.standalone-pwa [data-theme-option] { display: none !important; }\n'''
          path.write_text(s, encoding="utf-8")

          path = Path("manifest.webmanifest")
          s = path.read_text(encoding="utf-8")
          s = re.sub(r'"start_url":\s*"[^"]+"', f'"start_url": "./?pwa={VERSION}"', s)
          if '"id"' not in s:
              s = s.replace('{\n', '{\n  "id": "./",\n', 1)
          path.write_text(s, encoding="utf-8")

          sw = f'''const CACHE_NAME = "rootbody-v8-architecture-v{VERSION}";\n\nconst APP_SHELL = [\n  "./",\n  "./index.html",\n  "./styles.css?v={VERSION}",\n  "./v8.css?v={VERSION}",\n  "./food-data.js?v={VERSION}",\n  "./coach-data.js?v={VERSION}",\n  "./health-engine.js?v={VERSION}",\n  "./app.js?v={VERSION}",\n  "./coach.js?v={VERSION}",\n  "./intelligence.js?v={VERSION}",\n  "./manifest.webmanifest?v={VERSION}",\n  "./brand/rootbody-symbol.svg",\n  "./brand/rootbody-logo.svg",\n  "./brand/rootbody-wordmark.svg",\n  "./brand/rootbody-mark.svg",\n  "./brand/rootbody-mark-dark.svg",\n  "./brand/rootbody-lab.svg",\n  "./fonts/open-sans-vietnamese.woff2",\n  "./fonts/open-sans-latin-ext.woff2",\n  "./fonts/open-sans-latin.woff2",\n  "./icon-180.png?v={VERSION}",\n  "./icon-192.png",\n  "./icon-512.png"\n];\n\nself.addEventListener("install", (event) => {{\n  event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(APP_SHELL)));\n  self.skipWaiting();\n}});\n\nself.addEventListener("activate", (event) => {{\n  event.waitUntil(\n    caches.keys()\n      .then((keys) => Promise.all(keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))))\n      .then(() => self.clients.claim())\n  );\n}});\n\nself.addEventListener("fetch", (event) => {{\n  if (event.request.method !== "GET") return;\n  const url = new URL(event.request.url);\n  if (url.origin !== self.location.origin) return;\n\n  if (event.request.mode === "navigate") {{\n    event.respondWith(\n      fetch(event.request, {{ cache: "no-store" }})\n        .then((response) => {{\n          if (!response.ok) throw new Error("Navigation failed: " + response.status);\n          const copy = response.clone();\n          caches.open(CACHE_NAME).then((cache) => cache.put("./index.html", copy));\n          return response;\n        }})\n        .catch(() => caches.match("./index.html"))\n    );\n    return;\n  }}\n\n  event.respondWith(\n    fetch(event.request)\n      .then((response) => {{\n        if (response.ok) {{\n          const copy = response.clone();\n          caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));\n        }}\n        return response;\n      }})\n      .catch(() => caches.match(event.request))\n  );\n}});\n'''
          Path("sw.js").write_text(sw, encoding="utf-8")
          PY

      - name: Verify rebuilt shell invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'apple-mobile-web-app-status-bar-style" content="default"' index.html
          ! grep -q 'html.standalone-pwa body::before' v8.css
          grep -q 'html.standalone-pwa { --rb-safe-top: 0px; }' v8.css
          grep -q 'width: 112px; height: 131px' v8.css
          ! grep -q 'statusBar.setAttribute("content", "black-translucent")' app.js
          grep -q 'rootbody-v8-architecture-v69' sw.js

      - name: Commit rebuilt source
        shell: bash
        run: |
          git config user.name "Rootbody Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js v8.css manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Rebuild iOS standalone shell at source"
          git push