name: One-time light-only rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/light-only-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock Rootbody to light mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "70"

          # index.html: hard-lock first paint to light and remove theme controls.
          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          s = s.replace('<meta name="color-scheme" content="light dark">', '<meta name="color-scheme" content="light">')
          s = s.replace(
              '''        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";\n        const saved = localStorage.getItem("rootbody.theme");\n        const theme = standalone ? systemTheme : (saved === "dark" || saved === "light" ? saved : systemTheme);\n        document.documentElement.dataset.theme = theme;\n        document.documentElement.style.colorScheme = theme;\n        document.querySelector("[data-theme-color]")?.setAttribute("content", theme === "dark" ? "#08121D" : "#F6F8FA");''',
              '''        document.documentElement.dataset.theme = "light";\n        document.documentElement.style.colorScheme = "light";\n        document.querySelector("[data-theme-color]")?.setAttribute("content", "#F6F8FA");\n        try { localStorage.removeItem("rootbody.theme"); } catch (error) {}'''
          )
          # Remove the visible quick theme button from the Today header.
          s = re.sub(
              r'\n\s*<button class="rb-header-icon rb-theme-quick-toggle"[^>]*data-theme-toggle[^>]*>.*?</button>',
              '',
              s,
              count=1,
              flags=re.S
          )
          # Remove the two-option theme control if present in the You/settings UI.
          s = re.sub(
              r'\n\s*<div class="rb-theme-control"[^>]*>.*?</div>',
              '',
              s,
              count=1,
              flags=re.S
          )
          for asset in ["styles.css", "v8.css", "food-data.js", "coach-data.js", "health-engine.js", "app.js", "coach.js", "intelligence.js"]:
              s = re.sub(rf'({re.escape(asset)})\?v=\d+', rf'\1?v={VERSION}', s)
          s = re.sub(r'href="\.\/manifest\.webmanifest(?:\?v=\d+)?"', f'href="./manifest.webmanifest?v={VERSION}"', s)
          s = re.sub(r'href="\.\/icon-180\.png(?:\?v=\d+)?"', f'href="./icon-180.png?v={VERSION}"', s)
          path.write_text(s, encoding="utf-8")

          # app.js: make theme application idempotently light-only and remove system listeners.
          path = Path("app.js")
          s = path.read_text(encoding="utf-8")
          start = s.find('  function applyTheme(theme, persist = true) {')
          end = s.find('\n  function dayData(', start)
          if start != -1 and end != -1:
              replacement = '''  function applyTheme(theme, persist = true) {\n    document.documentElement.dataset.theme = "light";\n    document.documentElement.style.colorScheme = "light";\n    const meta = $("[data-theme-color]");\n    if (meta) meta.setAttribute("content", "#F6F8FA");\n    $$('[data-rootbody-mark]').forEach((image) => {\n      image.setAttribute("src", "./brand/rootbody-mark.svg");\n    });\n    try { localStorage.removeItem(THEME_KEY); } catch (error) {}\n  }\n'''
              s = s[:start] + replacement + s[end:]
          s = re.sub(
              r'\n\s*const standaloneThemeMedia = matchMedia\("\(prefers-color-scheme: dark\)"\);.*?\n\s*}\n\n\s*renderAll\(\);',
              '\n\n  applyTheme("light", false);\n  renderAll();',
              s,
              count=1,
              flags=re.S
          )
          # Remove click handlers for theme controls if they remain in source.
          s = re.sub(
              r'\n\s*\$\$\(\'\[data-theme-option\]\'\).*?\n\s*}\);',
              '',
              s,
              flags=re.S
          )
          s = re.sub(
              r'\n\s*\$\$\(\'\[data-theme-toggle\]\'\).*?\n\s*}\);',
              '',
              s,
              flags=re.S
          )
          s = re.sub(r'navigator\.serviceWorker\.register\("\.\/sw\.js\?v=\d+"\)', f'navigator.serviceWorker.register("./sw.js?v={VERSION}")', s)
          path.write_text(s, encoding="utf-8")

          # v8.css: final safety lock. Even stale dark data-theme cannot produce a dark UI.
          path = Path("v8.css")
          s = path.read_text(encoding="utf-8")
          # Remove the previous standalone-only theme-control rule; replace with universal removal.
          s = re.sub(
              r'\n/\* iOS standalone shell v69 \*/\nhtml\.standalone-pwa \[data-theme-toggle\],\nhtml\.standalone-pwa \[data-theme-option\] \{ display: none !important; \}\n?',
              '\n',
              s
          )
          lock = '''\n\n/* Rootbody v70 — light-only product shell */\nhtml { color-scheme: light !important; }\nhtml[data-theme="dark"] {\n  --bg: #F6F8FA;\n  --surface: #FFFFFF;\n  --surface-2: #F1F5F7;\n  --surface-3: #E8EFF2;\n  --ink: #0D1B2A;\n  --muted: #5F6976;\n  --subtle: #667381;\n  --line: #DCE5EA;\n  --line-strong: #C6D2D9;\n  --green: #0FA3A3;\n  --green-strong: #087B7B;\n  --green-soft: #E4F6F7;\n  --cyan: #BFE9F3;\n  --violet: #6F6AAE;\n  --violet-soft: #EFEEF8;\n  --danger: #A33838;\n  --warning: #A46412;\n}\n[data-theme-toggle], [data-theme-option], .rb-theme-control { display: none !important; }\n'''
          if '/* Rootbody v70 — light-only product shell */' not in s:
              s += lock
          path.write_text(s, encoding="utf-8")

          # manifest stays explicitly light and gets a fresh install route.
          path = Path("manifest.webmanifest")
          s = path.read_text(encoding="utf-8")
          s = re.sub(r'"start_url":\s*"[^"]+"', f'"start_url": "./?pwa={VERSION}"', s)
          s = re.sub(r'"background_color":\s*"[^"]+"', '"background_color": "#F6F8FA"', s)
          s = re.sub(r'"theme_color":\s*"[^"]+"', '"theme_color": "#F6F8FA"', s)
          path.write_text(s, encoding="utf-8")

          # sw.js: bump clean cache only.
          path = Path("sw.js")
          s = path.read_text(encoding="utf-8")
          s = re.sub(r'rootbody-v8-architecture-v\d+', f'rootbody-v8-architecture-v{VERSION}', s)
          s = re.sub(r'\?v=\d+', f'?v={VERSION}', s)
          path.write_text(s, encoding="utf-8")
          PY

      - name: Verify light-only invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<meta name="color-scheme" content="light">' index.html
          grep -q 'dataset.theme = "light"' index.html
          ! grep -q 'rb-theme-quick-toggle' index.html
          ! grep -q 'class="rb-theme-control"' index.html
          ! grep -q 'prefers-color-scheme: dark' app.js
          grep -q 'applyTheme("light", false)' app.js
          grep -q 'Rootbody v70 — light-only product shell' v8.css
          grep -q 'rootbody-v8-architecture-v70' sw.js
          grep -q '"start_url": "./?pwa=70"' manifest.webmanifest

      - name: Commit light-only source
        shell: bash
        run: |
          git config user.name "Rootbody Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js v8.css manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Lock Rootbody to light mode"
          git push
